name: Classmap tooling

on:
  pull_request:
    branches:
      - "main"
      - "v3-beta"
      - "*/main/*/**"
    paths:
      - "scripts/classmap-*"
      - "scripts/platform-contract*"
      - "css-map.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/classmap-tooling.yml"
  push:
    branches:
      - "main"
      - "v3-beta"
      - "*/main/*/**"
    paths:
      - "scripts/classmap-*"
      - "scripts/platform-contract*"
      - "css-map.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/classmap-tooling.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test classmap tooling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node and pnpm
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec oxlint scripts/classmap-capture.ts scripts/classmap-capture.test.mts scripts/classmap-cdp-verify.mjs scripts/classmap-cdp-verify.test.mjs scripts/platform-contract.ts scripts/platform-contract.test.mts

      - name: Check formatting
        run: pnpm exec oxfmt --check scripts/classmap-capture.ts scripts/classmap-capture.test.mts scripts/classmap-cdp-verify.mjs scripts/classmap-cdp-verify.test.mjs scripts/platform-contract.ts scripts/platform-contract.test.mts scripts/platform-contract.json

      - name: Test
        run: node --test "scripts/classmap-*.test.mts" "scripts/classmap-*.test.mjs" scripts/platform-contract.test.mts
