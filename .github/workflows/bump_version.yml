name: Bump Version
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version component to bump"
        type: choice
        required: true
        default: "patch"
        options:
          - patch
          - minor
          - major

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Bump version
        run: |
          cargo set-version --bump ${{ inputs.bump }}
          version=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "spicetify") | .version')
          echo "version=$version" >> $GITHUB_ENV

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/Cargo.toml app/Cargo.lock
          git commit -m "chore: bump to v${{ env.version }}"
          git tag "v${{ env.version }}"
          git push origin HEAD
          git push origin "v${{ env.version }}"
