name: Bump Version
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version component to bump"
        type: choice
        required: true
        default: "patch"
        options:
          - patch
          - minor
          - major

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Bump version
        id: bump-version
        run: |
          cargo set-version --bump ${{ inputs.bump }}
          version=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "spicetify") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        id: commit
        uses: IAreKyleW00t/verified-bot-commit@126a6a11889ab05bcff72ec2403c326cd249b84c
        with:
          message: "chore: bump to v${{ steps.bump-version.outputs.version }}"
          ref: refs/heads/main
          tag: "v${{ steps.bump-version.outputs.version }}"
          files: '**'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref main -f tag="${{ steps.bump-version.outputs.version }}"

