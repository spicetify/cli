name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version (without v prefix)"
        required: true

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ inputs.tag }}

  build-cli-linux:
    uses: ./.github/workflows/build-linux.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs: setup
    strategy:
      matrix:
        arch: [amd64]
    with:
      tag: ${{ needs.setup.outputs.tag }}
      arch: ${{ matrix.arch }}

  build-cli-macos:
    uses: ./.github/workflows/build-macos.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs: setup
    with:
      tag: ${{ needs.setup.outputs.tag }}

  build-cli-windows:
    uses: ./.github/workflows/build-windows.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs: setup
    strategy:
      matrix:
        arch: [amd64, arm64]
    with:
      tag: ${{ needs.setup.outputs.tag }}
      arch: ${{ matrix.arch }}

  release:
    runs-on: ubuntu-latest
    needs: [setup, build-cli-linux, build-cli-macos, build-cli-windows]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Attest
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.setup.outputs.tag }}
          files: "dist/*"
          generate_release_notes: true
