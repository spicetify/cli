name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version (without v prefix)"
        required: true

jobs:
  build-app-linux:
    uses: ./.github/workflows/build-linux.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        arch: [x86_64]
    with:
      tag: ${{ inputs.tag }}
      arch: ${{ matrix.arch }}

  build-app-macos:
    uses: ./.github/workflows/build-macos.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      tag: ${{ inputs.tag }}

  build-app-windows:
    uses: ./.github/workflows/build-windows.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    with:
      tag: ${{ inputs.tag }}
      arch: ${{ matrix.arch }}

  release:
    runs-on: ubuntu-latest
    needs: [build-app-linux, build-app-macos, build-app-windows]
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Attest
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.tag }}
          files: "dist/*"
          generate_release_notes: true
