name: Rust

on:
  pull_request:
    branches:
      - "main"
      - "v3-beta"
      - "*/main/*/**"
    paths:
      - "rust/**"
      - "src/jsHelper/**"
      - "scripts/build-payload.mjs"
      - ".github/workflows/rust.yml"
  push:
    branches:
      - "main"
      - "v3-beta"
      - "*/main/*/**"
    paths:
      - "rust/**"
      - "src/jsHelper/**"
      - "scripts/build-payload.mjs"
      - ".github/workflows/rust.yml"

jobs:
  build:
    # Windows is in the matrix because the junction crate that replaced the
    # unstable std junction_point API only compiles there: macOS cannot prove
    # that swap locally.
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show toolchain
        run: rustup show active-toolchain

      # The wrapper and loader are embedded into the binary at compile time, so
      # they must exist before cargo runs: a build without them produces a CLI
      # that refuses to apply.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Node dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build client payload
        working-directory: .
        run: pnpm build:payload

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --locked -- -D warnings
