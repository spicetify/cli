name: Rust

on:
  pull_request:
    branches:
      - "main"
      - "v3-beta"
      - "*/main/*/**"
    paths:
      - "rust/**"
      - "src/jsHelper/**"
      - "install.sh"
      - "install.ps1"
      - "scripts/test-install-*.ps1"
      - "scripts/test-install-completions.sh"
      - "scripts/setup-windows-arm64.ps1"
      - ".github/workflows/rust-release.yml"
      - "scripts/build-payload.mjs"
      - "package.json"
      - "globals.d.ts"
      - "tsconfig.wrapper.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/rust.yml"
  push:
    branches:
      - "main"
      - "v3-beta"
      - "*/main/*/**"
    paths:
      - "rust/**"
      - "src/jsHelper/**"
      - "install.sh"
      - "install.ps1"
      - "scripts/test-install-*.ps1"
      - "scripts/test-install-completions.sh"
      - "scripts/setup-windows-arm64.ps1"
      - ".github/workflows/rust-release.yml"
      - "scripts/build-payload.mjs"
      - "package.json"
      - "globals.d.ts"
      - "tsconfig.wrapper.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/rust.yml"

jobs:
  build:
    # Windows is in the matrix because the junction crate that replaced the
    # unstable std junction_point API only compiles there: macOS cannot prove
    # that swap locally.
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest, windows-11-arm]
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure native Windows ARM64 toolchain
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: pwsh
        working-directory: .
        run: ./scripts/setup-windows-arm64.ps1

      - name: Show toolchain
        run: rustup show active-toolchain

      - name: Test POSIX shell completion installation
        if: runner.os != 'Windows'
        working-directory: .
        run: sh scripts/test-install-completions.sh

      - name: Test PowerShell completion installation
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          ./scripts/test-install-completions.ps1
          ./scripts/test-install-architecture.ps1
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File ./scripts/test-install-architecture.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File ./scripts/test-install-architecture.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup Node and pnpm
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target

      - name: Install Node dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build client payload
        working-directory: .
        run: pnpm build:payload

      - name: Test client payload
        working-directory: .
        run: node --test "src/jsHelper/**/*.test.mts"

      - name: Type-check wrapper against globals.d.ts
        if: runner.os == 'Linux'
        working-directory: .
        run: pnpm typecheck

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked --features daemon/native-window-controls-tests

      - name: Test experimental Windows updates
        if: runner.os == 'Windows'
        run: cargo test -p daemon --locked --features experimental-windows-updates update_job

      - name: Clippy
        run: cargo clippy --workspace --locked -- -D warnings
