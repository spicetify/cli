name: Rust

on:
  pull_request:
    branches:
      - "main"
      - "v3-beta"
      - "*/main/*/**"
    paths:
      - "rust/**"
      - "src/jsHelper/**"
      - "install.sh"
      - "install.ps1"
      - "scripts/test-install-completions.*"
      - "scripts/build-payload.mjs"
      - ".github/workflows/rust.yml"
  push:
    branches:
      - "main"
      - "v3-beta"
      - "*/main/*/**"
    paths:
      - "rust/**"
      - "src/jsHelper/**"
      - "install.sh"
      - "install.ps1"
      - "scripts/test-install-completions.*"
      - "scripts/build-payload.mjs"
      - ".github/workflows/rust.yml"

jobs:
  build:
    # Windows is in the matrix because the junction crate that replaced the
    # unstable std junction_point API only compiles there: macOS cannot prove
    # that swap locally.
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: rustup show active-toolchain

      - name: Test POSIX shell completion installation
        if: runner.os != 'Windows'
        working-directory: .
        run: sh scripts/test-install-completions.sh

      - name: Test PowerShell completion installation
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: ./scripts/test-install-completions.ps1

      - name: Setup Node and pnpm
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Install Node dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build client payload
        working-directory: .
        run: pnpm build:payload

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked --features daemon/native-window-controls-tests

      - name: Clippy
        run: cargo clippy --workspace --locked -- -D warnings
