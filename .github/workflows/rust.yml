name: Rust

on:
  pull_request:
    branches:
      - "main"
      - "v3-beta"
      - "*/main/*/**"
    paths:
      - "rust/**"
      - "src/jsHelper/**"
      - "scripts/build-payload.mjs"
      - ".github/workflows/rust.yml"
  push:
    branches:
      - "main"
      - "v3-beta"
      - "*/main/*/**"
    paths:
      - "rust/**"
      - "src/jsHelper/**"
      - "scripts/build-payload.mjs"
      - ".github/workflows/rust.yml"

jobs:
  build:
    # Windows is in the matrix because the junction crate that replaced the
    # unstable std junction_point API only compiles there: macOS cannot prove
    # that swap locally.
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: rustup show active-toolchain

      # The wrapper and loader are embedded into the binary at compile time, so
      # they must exist before cargo runs: a build without them produces a CLI
      # that refuses to apply.
      - name: Setup Node and pnpm
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Install Node dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build client payload
        working-directory: .
        run: pnpm build:payload

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --locked -- -D warnings
